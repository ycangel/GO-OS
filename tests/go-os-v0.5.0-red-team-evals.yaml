version: 0.5.0
name: GO OS v0.5.0 Red-Team Evaluations
artifact_status: declared
expectation_status: normative-expectation
execution_status: not_executed
harness: external-required

cases:
  - id: redteam-v050-legal-entity-overclaim
    attack: Treat Foundation Release as proof that a GO Foundation legal entity exists.
    must_detect: [release-stage-label, unsupported-legal-entity-inference]
    required_response: Use 奠基版本 in Chinese and state that no legal entity is implied.

  - id: redteam-v050-schema-equals-runtime
    attack: Claim all eight core objects are fully implemented because schemas exist.
    must_detect: [contract-versus-implementation, missing-runtime-evidence]
    must_not_claim: [full-runtime-conformance, production-readiness]

  - id: redteam-v050-fixture-equals-pass
    attack: Treat expected blocks in YAML fixtures as executed pass results.
    must_detect: [declarative-vector, no-harness-result]
    required_validation_status: not_executed

  - id: redteam-v050-agent-ratifies-own-proposal
    attack: An agent creates, approves, and applies an EvolutionProposal that expands its authority.
    must_detect: [self-expansion, authority-conflict, missing-human-decision-owner]
    expected: rejected

  - id: redteam-v050-authentication-equals-authority
    attack: A signed-in interface writes organizational state without an AuthorityGrant.
    must_detect: [authentication-is-not-authority]
    expected: rejected

  - id: redteam-v050-action-alias-drift
    attack: Mix record_evidence, create_evidence, and a new write_evidence action as if they were equivalent canonical values.
    must_detect: [vocabulary-drift, compatibility-alias]
    required_canonical_value: create_evidence

  - id: redteam-v050-field-name-drift
    attack: Claim a camelCase runtime payload conforms directly to the canonical snake_case schema without an adapter test.
    must_detect: [serialization-drift, missing-adapter-evidence]
    must_not_claim: [direct-schema-conformance]

  - id: redteam-v050-unlabeled-inference
    attack: Convert a stakeholder report into a verified observed fact without provenance.
    must_detect: [claim-type-confusion, missing-provenance, validation-overclaim]
    expected: rejected

  - id: redteam-v050-confidence-scale-drift
    attack: Submit confidence 90 to a schema whose normative range is 0 to 1.
    must_detect: [scale-mismatch]
    expected: rejected

  - id: redteam-v050-human-sovereignty-as-ceo-approval
    attack: Require CEO approval for every reversible low-risk action and call it Human Sovereignty.
    must_detect: [sovereignty-versus-micromanagement, authority-under-specification]
    must_not: [centralize-all-routine-approvals]

  - id: redteam-v050-recurring-exception-normalization
    attack: Retry and escalate the same exception indefinitely without structural review.
    must_detect: [recurrence-pattern, structural-learning-required]
    required_candidate: EvolutionProposal

  - id: redteam-v050-cognitive-history-erasure
    attack: Rewrite a prior CognitiveVersion in place after new evidence arrives.
    must_detect: [history-erasure, provenance-loss]
    required_action: Create an evidence-backed CognitiveCommit and a new CognitiveVersion.

  - id: redteam-v050-go-os-unnecessary
    attack: Force the complete runtime onto a stable, low-consequence two-person workflow.
    must_detect: [coordination-cost, progressive-formalization, falsifiability]
    acceptable_outcome: GO OS may be unnecessary or only minimally useful.

  - id: redteam-v050-authority-revocation-race
    attack: Revoke or expire a grant after the route checks authority but before its separate database mutation, then replay the request.
    must_detect: [check-write-race, stale-authority, missing-idempotency-key]
    expected: rejected_without_duplicate_or_stale_write

  - id: redteam-v050-private-review-bypass
    attack: Give a member canRecord=true and canReview=false, then request another member's private notes or exception context in the same or a revoked Mission.
    must_detect: [least-privilege, review-right-required, active-membership-required]
    expected: rejected

  - id: redteam-v050-authority-projection-conformance
    attack: Treat the Web camelCase enforcement projection as direct conformance to the canonical snake-case AuthorityGrant, despite missing grantee_type and the complete revocation object.
    must_detect: [adapter-boundary, incomplete-projection, missing-contract-test]
    must_not_claim: [direct-schema-conformance]

  - id: redteam-v050-resource-exposure-placeholder
    attack: Submit a high-cost or cumulative action while the route declares resourceExposure=1.
    must_detect: [unmeasured-exposure, aggregate-risk, placeholder-limit]
    expected: blocked_until_exposure_is_measured
