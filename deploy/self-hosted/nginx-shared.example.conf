# Public-read-only reverse-proxy example for a host whose existing Nginx owns
# ports 80/443. This is not an authenticated Web gateway. Replace the example
# hostname and certificate directives through the host operator's normal
# configuration process.

server {
    listen 80;
    server_name go.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name go.example.org;

    # ssl_certificate and ssl_certificate_key belong to the shared host.

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Public traffic must never provide a trusted application identity.
        proxy_set_header X-Go-Web-Identity-Secret "";
        proxy_set_header X-Go-Web-Identity-Id "";
        proxy_set_header X-Go-Web-Identity-Email "";
        proxy_set_header X-Go-Web-Identity-Name "";
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Oai-Authenticated-User-Email "";
        proxy_set_header Oai-Authenticated-User-Full-Name "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Go-Web-Identity-Secret "";
        proxy_set_header X-Go-Web-Identity-Id "";
        proxy_set_header X-Go-Web-Identity-Email "";
        proxy_set_header X-Go-Web-Identity-Name "";
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Oai-Authenticated-User-Email "";
        proxy_set_header Oai-Authenticated-User-Full-Name "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
